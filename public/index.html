<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FF UID Checker</title>
  <style>
    body{
      font-family:Arial, sans-serif;
      background:#07111a;
      color:#e8f5ff;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      margin:0;
      padding:12px;
      box-sizing:border-box;
    }
    .card{
      width:100%;
      max-width:360px;
      background:linear-gradient(180deg,#0f2230,#081522);
      padding:18px;
      border-radius:12px;
      box-shadow:0 10px 30px rgba(0,0,0,0.6);
      box-sizing:border-box;
    }
    h2{
      margin:0 0 8px 0;
      font-size:20px;
      color:#fff;
    }
    input,select{
      width:100%;
      padding:10px;
      border-radius:8px;
      border:1px solid rgba(255,255,255,0.06);
      background:rgba(255,255,255,0.03);
      color:inherit;
      margin-top:8px;
      box-sizing:border-box;
    }
    button{
      width:100%;
      margin-top:12px;
      padding:12px;
      border-radius:10px;
      border:0;
      background:linear-gradient(90deg,#00c6ff,#007bff);
      color:#001;
      font-weight:700;
      cursor:pointer;
    }
    .result{
      display:none;
      margin-top:12px;
      background:rgba(0,0,0,0.18);
      padding:12px;
      border-radius:8px;
      color:#dff9ff;
    }
    .error{
      display:none;
      margin-top:12px;
      background:#ffb4b4;
      padding:8px;
      border-radius:8px;
      color:#2a0000;
    }

    /* Uiverse loader */
    .loader-overlay{
      position:fixed;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      background:rgba(0,0,0,0.5);
      z-index:998;
    }
    .loader-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 180px;
      height: 180px;
      font-family: "Inter", sans-serif;
      font-size: 1.2em;
      font-weight: 300;
      color: white;
      border-radius: 50%;
      background-color: transparent;
      user-select: none;
    }
    .loader {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background-color: transparent;
      animation: loader-rotate 2s linear infinite;
      z-index: 0;
    }
    @keyframes loader-rotate {
      0% {
        transform: rotate(90deg);
        box-shadow:
          0 10px 20px 0 #fff inset,
          0 20px 30px 0 #ad5fff inset,
          0 60px 60px 0 #471eec inset;
      }
      50% {
        transform: rotate(270deg);
        box-shadow:
          0 10px 20px 0 #fff inset,
          0 20px 10px 0 #d60a47 inset,
          0 40px 60px 0 #311e80 inset;
      }
      100% {
        transform: rotate(450deg);
        box-shadow:
          0 10px 20px 0 #fff inset,
          0 20px 30px 0 #ad5fff inset,
          0 60px 60px 0 #471eec inset;
      }
    }
    .loader-letter {
      display: inline-block;
      opacity: 0.4;
      transform: translateY(0);
      animation: loader-letter-anim 2s infinite;
      z-index: 1;
      border-radius: 50ch;
      border: none;
    }
    .loader-letter:nth-child(1) { animation-delay: 0s; }
    .loader-letter:nth-child(2) { animation-delay: 0.1s; }
    .loader-letter:nth-child(3) { animation-delay: 0.2s; }
    .loader-letter:nth-child(4) { animation-delay: 0.3s; }
    .loader-letter:nth-child(5) { animation-delay: 0.4s; }
    .loader-letter:nth-child(6) { animation-delay: 0.5s; }
    .loader-letter:nth-child(7) { animation-delay: 0.6s; }
    .loader-letter:nth-child(8) { animation-delay: 0.7s; }
    .loader-letter:nth-child(9) { animation-delay: 0.8s; }
    .loader-letter:nth-child(10){ animation-delay: 0.9s; }

    @keyframes loader-letter-anim {
      0%,100% {
        opacity: 0.4;
        transform: translateY(0);
      }
      20% {
        opacity: 1;
        transform: scale(1.15);
      }
      40% {
        opacity: 0.7;
        transform: translateY(0);
      }
    }

    /* Watermark bottom-right */
    .watermark{
      position:fixed;
      bottom:8px;
      right:8px;
      display:flex;
      align-items:center;
      gap:6px;
      background:rgba(0,0,0,0.55);
      padding:6px 10px;
      border-radius:999px;
      font-size:11px;
      color:#e8f5ff;
      z-index:999;
      max-width:90vw;
    }
    .watermark span{
      opacity:0.9;
      white-space:nowrap;
    }
    .watermark a{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:22px;
      height:22px;
      border-radius:50%;
      overflow:hidden;
      background:#111827;
      flex-shrink:0;
    }
    .watermark svg{
      width:100%;
      height:100%;
      display:block;
    }

    @media (max-width:480px){
      .watermark{
        font-size:10px;
        padding:5px 8px;
      }
      .watermark a{
        width:20px;
        height:20px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Free Fire UID Checker</h2>
    <div style="font-size:13px;color:#89bfcf">Enter player UID and check profile</div>

    <input id="uid" placeholder="UID (e.g. 451012596)" inputmode="numeric" />
    <select id="region">
      <option>IND</option>
      <option>BR</option>
      <option>US</option>
      <option>SAC</option>
      <option>NA</option>
    </select>
    <button id="checkBtn">Check Profile</button>

    <div id="error" class="error"></div>

    <div id="result" class="result">
      <div><strong>Nickname:</strong> <span id="nick">-</span></div>
      <div><strong>Level:</strong> <span id="level">-</span></div>
      <div><strong>Region:</strong> <span id="rgn">-</span></div>
      <div><strong>Likes:</strong> <span id="likes">-</span></div>
      <div><strong>Bio:</strong> <span id="bio">-</span></div>
      <hr style="border:none;border-top:1px solid rgba(255,255,255,0.06);margin:10px 0">
      <div><strong>Guild:</strong> <span id="clan">-</span></div>
      <div><strong>Guild Owner:</strong> <span id="owner">-</span></div>
    </div>
  </div>

  <!-- Loader overlay -->
  <div id="loaderOverlay" class="loader-overlay">
    <div class="loader-wrapper">
      <span class="loader-letter">G</span>
      <span class="loader-letter">e</span>
      <span class="loader-letter">n</span>
      <span class="loader-letter">e</span>
      <span class="loader-letter">r</span>
      <span class="loader-letter">a</span>
      <span class="loader-letter">t</span>
      <span class="loader-letter">i</span>
      <span class="loader-letter">n</span>
      <span class="loader-letter">g</span>
      <div class="loader"></div>
    </div>
  </div>

  <!-- Watermark / Branding -->
  <div class="watermark">
    <span>Developed by Unknown Gamer</span>

    <!-- Proper YouTube play icon (red rounded rect + white triangle) -->
    <a href="https://www.youtube.com/channel/UC_JNgrNT7mtS0pyUNw9Ze1w" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="2" y="4" width="20" height="16" rx="4" ry="4" fill="#FF0000"></rect>
        <polygon points="10,8 16,12 10,16" fill="#FFFFFF"></polygon>
      </svg>
    </a>

    <!-- WhatsApp SVG (green circle with phone) -->
    <a href="https://chat.whatsapp.com/EnLXapxBiYHEsbF7bLUnTL" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 512 512" aria-hidden="true">
        <defs>
          <linearGradient id="wa-bg" gradientUnits="userSpaceOnUse" x1="11337.28" y1="1518.24" x2="21337.28" y2="-2164.82" gradientTransform="matrix(0.19,0,0,-0.19,0.81,98.89)">
            <stop offset="0" stop-color="#61fd7d"/>
            <stop offset="1" stop-color="#2bb826"/>
          </linearGradient>
        </defs>
        <path d="M512,382.07c0,2.8-.09,8.88-.26,13.58-.41,11.49-1.32,26.32-2.7,33.07a109.76,109.76,0,0,1-9.27,27.71,98.45,98.45,0,0,1-43.43,43.39,110.21,110.21,0,0,1-27.87,9.28c-6.69,1.35-21.41,2.24-32.82,2.65-4.71.17-10.79.25-13.58.25l-252.1,0c-2.8,0-8.88-.09-13.58-.26-11.49-.41-26.32-1.32-33.07-2.69a110.37,110.37,0,0,1-27.72-9.28A98.5,98.5,0,0,1,12.18,456.3,110.21,110.21,0,0,1,2.9,428.43C1.55,421.74.66,407,.25,395.61.08,390.91,0,384.82,0,382l0-252.1c0-2.8.09-8.88.25-13.58C.71,104.86,1.62,90,3,83.28a110.37,110.37,0,0,1,9.27-27.72A98.59,98.59,0,0,1,55.7,12.18,110.21,110.21,0,0,1,83.57,2.9C90.26,1.55,105,.66,116.39.25,121.09.08,127.18,0,130,0l252.1,0c2.8,0,8.88.09,13.58.25C407.14.71,422,1.62,428.72,3a110.37,110.37,0,0,1,27.72,9.27A98.59,98.59,0,0,1,499.82,55.7a110.21,110.21,0,0,1,9.28,27.87c1.35,6.69,2.24,21.41,2.65,32.82.17,4.7.25,10.79.25,13.58Z" fill="url(#wa-bg)" />
        <path d="M379.56,131.67A172.4,172.4,0,0,0,256.67,80.73C161,80.73,83.05,158.64,83.05,254.42a173.47,173.47,0,0,0,23.2,86.82l-24.65,90,92.08-24.17a173.55,173.55,0,0,0,83,21.17h.07c95.73,0,173.69-77.91,173.69-173.69A172.73,172.73,0,0,0,379.53,131.7ZM256.72,399a144.17,144.17,0,0,1-73.52-20.14l-5.29-3.15L123.27,390l14.59-53.27-3.42-5.47a143.29,143.29,0,0,1-22.11-76.81C112.33,174.81,177.1,110,256.8,110A144.34,144.34,0,0,1,401.12,254.48C401.05,334.15,336.29,399,256.72,399Zm93.15-108.2c-4.32-2.2-25.68-12.67-29.65-14.12s-6.85-2.19-9.8,2.2-11.22,14.11-13.76,17-5.06,3.29-9.37,1.09-18.35-6.77-34.92-21.56c-12.88-11.5-21.61-25.74-24.15-30s-.29-6.71,1.92-8.83c2-1.93,4.32-5.06,6.51-7.6s2.88-4.32,4.32-7.26.74-5.42-.35-7.6-9.8-23.55-13.34-32.25c-3.49-8.51-7.12-7.32-9.79-7.47s-5.42-.13-8.29-.13a16,16,0,0,0-11.57,5.41c-4,4.32-15.2,14.86-15.2,36.22s15.54,42,17.72,44.91,30.61,46.76,74.14,65.54c10.34,4.44,18.42,7.11,24.72,9.18a60,60,0,0,0,27.32,1.71c8.35-1.23,25.68-10.49,29.31-20.62s3.63-18.83,2.55-20.62S355.25,292,350.87,289.8Z" fill="#fff" />
      </svg>
    </a>
  </div>

<script>
const checkBtn = document.getElementById('checkBtn');
const uidInput = document.getElementById('uid');
const regionSel = document.getElementById('region');
const resultBox = document.getElementById('result');
const errorBox = document.getElementById('error');
const loaderOverlay = document.getElementById('loaderOverlay');

function showLoader(on){
  loaderOverlay.style.display = on ? 'flex' : 'none';
}

checkBtn.addEventListener('click', async () => {
  const uid = (uidInput.value || '').trim();
  const region = (regionSel.value || 'IND').trim().toUpperCase();
  if (!uid || !/^\d+$/.test(uid)) { alert('Enter valid numeric UID'); uidInput.focus(); return; }

  errorBox.style.display = 'none';
  resultBox.style.display = 'none';
  showLoader(true);

  try {
    const res = await fetch(`/api/accinfo?uid=${encodeURIComponent(uid)}&region=${encodeURIComponent(region)}`);
    const json = await res.json();
    showLoader(false);
    if (!res.ok) {
      errorBox.textContent = json.error || json.message || 'Server error';
      errorBox.style.display = 'block';
      return;
    }
    const v = json.view || {};
    document.getElementById('nick').textContent = v.nickname || '-';
    document.getElementById('level').textContent = v.level || '-';
    document.getElementById('rgn').textContent = v.region || region;
    document.getElementById('likes').textContent = v.likes ?? '-';
    document.getElementById('bio').textContent = v.bio || '-';
    document.getElementById('clan').textContent = v.clanName || '-';
    document.getElementById('owner').textContent = v.clanOwner || '-';
    resultBox.style.display = 'block';
  } catch (err) {
    showLoader(false);
    errorBox.textContent = 'Fetch failed: ' + (err.message || err);
    errorBox.style.display = 'block';
  }
});
</script>
</body>
</html>
